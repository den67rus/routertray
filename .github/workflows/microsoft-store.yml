name: Microsoft Store Package

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Store package version in Major.Minor.Build.0 format
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate Partner Center identity
        shell: pwsh
        run: |
          $missing = @(
            'STORE_IDENTITY_NAME',
            'STORE_PUBLISHER',
            'STORE_PUBLISHER_DISPLAY_NAME'
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }

          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions repository variables from Partner Center: $($missing -join ', ')."
          }

      - name: Build MSIX bundle and Store upload package
        shell: pwsh
        run: |
          $parameters = @{
            Version = $env:STORE_VERSION
            IdentityName = $env:STORE_IDENTITY_NAME
            Publisher = $env:STORE_PUBLISHER
            PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          }
          .\packaging\MicrosoftStore\Build-StorePackage.ps1 @parameters

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: RouterTray-MicrosoftStore-${{ inputs.version }}
          path: |
            artifacts/store/*.msixupload
            artifacts/store/*.msixbundle
            artifacts/store/packages/*.msix
          if-no-files-found: error
          retention-days: 30
