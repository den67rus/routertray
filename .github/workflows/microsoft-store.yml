name: Microsoft Store Package

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Store package version in Major.Minor.Build.0 format
        required: true
        type: string
      source_ref:
        description: Branch or tag containing the application to package
        required: true
        default: main
        type: string
      publish:
        description: Submit the package to Microsoft Store for certification
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: microsoft-store-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate Partner Center identity
        shell: pwsh
        env:
          PUBLISH_STORE: ${{ inputs.publish }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $required = @(
            'STORE_IDENTITY_NAME',
            'STORE_PUBLISHER',
            'STORE_PUBLISHER_DISPLAY_NAME'
          )
          if ($env:PUBLISH_STORE -eq 'true') {
            $required += @(
              'STORE_PRODUCT_ID',
              'PARTNER_CENTER_TENANT_ID',
              'PARTNER_CENTER_SELLER_ID',
              'PARTNER_CENTER_CLIENT_ID',
              'PARTNER_CENTER_CLIENT_SECRET'
            )
          }
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })

          if ($missing.Count -gt 0) {
            throw "Configure these GitHub Actions variables/secrets from Partner Center: $($missing -join ', ')."
          }

      - name: Build MSIX bundle and Store upload package
        shell: pwsh
        run: |
          $parameters = @{
            Version = $env:STORE_VERSION
            IdentityName = $env:STORE_IDENTITY_NAME
            Publisher = $env:STORE_PUBLISHER
            PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          }
          .\packaging\MicrosoftStore\Build-StorePackage.ps1 @parameters

      - name: Upload Partner Center submission
        uses: actions/upload-artifact@v7
        with:
          name: RouterTray-PartnerCenter-${{ inputs.version }}
          path: artifacts/store/*.msixupload
          if-no-files-found: error
          retention-days: 30

      - name: Setup Microsoft Store Developer CLI
        if: inputs.publish
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.4.3

      - name: Authenticate with Partner Center
        if: inputs.publish
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Submit package to Microsoft Store
        if: inputs.publish
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'artifacts\store' -Filter '*.msixupload' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one .msixupload package, found $($packages.Count)."
          }

          msstore publish $packages[0].FullName --appId $env:STORE_PRODUCT_ID --uploadTimeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
